name: Review PDF acceptance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  acceptance:
    name: Build and verify review PDFs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install TeX Live and Biber
        run: |
          sudo apt-get update
          # newtxmath reads binhex.tex from texlive-plain-generic on Ubuntu.
          sudo apt-get install -y --no-install-recommends \
            biber fonts-linuxlibertine texlive-bibtex-extra texlive-fonts-extra \
            texlive-latex-extra texlive-plain-generic texlive-publishers
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run acceptance tests
        run: python -m unittest discover -s tests -v
